<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────────── -->
    <title>James Sederia — portfolio</title>
    <meta
      name="description"
      content="James Sederia is a front-end developer at AWS SBG JRU building clean, accessible, high-performance web interfaces with HTML, CSS, JavaScript, and React. Available for work and freelance projects."
    />
    <meta name="author" content="James Sederia" />
    <meta
      name="keywords"
      content="James Sederia, front-end developer, React developer, web developer, JavaScript, HTML, CSS, AWS SBG JRU, freelance developer, portfolio"
    />
    <link rel="canonical" href="https://jamessederia.dev/" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- ── Theme colour for the browser UI ─────────────────────────── -->
    <meta name="theme-color" content="#f5faf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d0b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />

    <!-- ── Open Graph (Facebook, LinkedIn, Discord) ────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="James Sederia" />
    <meta property="og:title" content="James Sederia — Front-end Developer" />
    <meta
      property="og:description"
      content="Front-end developer at AWS SBG JRU building clean, accessible interfaces with React, JavaScript, HTML, and CSS."
    />
    <meta property="og:url" content="https://jamessederia.dev/" />
    <meta property="og:image" content="https://jamessederia.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="James Sederia, Front-end Developer" />

    <!-- ── Twitter / X card ────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="James Sederia — Front-end Developer" />
    <meta
      name="twitter:description"
      content="Front-end developer at AWS SBG JRU building clean, accessible interfaces with React, JavaScript, HTML, and CSS."
    />
    <meta name="twitter:image" content="https://jamessederia.dev/og-image.png" />

    <!-- ── Fonts (preconnect for faster first paint) ───────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ── Apply the saved theme before paint to avoid a flash ─────── -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
