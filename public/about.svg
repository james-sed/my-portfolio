<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Developer illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ce6ad"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- orbit accents -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 10"/>

  <!-- avatar -->
  <circle cx="300" cy="300" r="128" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="300" cy="300" r="118" fill="#ffffff" fill-opacity="0.12"/>

  <!-- person silhouette -->
  <circle cx="300" cy="258" r="44" fill="#06231d"/>
  <path d="M300 320c-62 0-84 34-88 58-3 18 12 34 30 34h116c18 0 33-16 30-34-4-24-26-58-88-58z" fill="#06231d"/>

  <!-- code badge -->
  <g transform="translate(392 198)">
    <rect width="86" height="34" rx="17" fill="#06231d"/>
    <text x="43" y="22" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#34d399">&lt;/&gt;</text>
  </g>

  <!-- floating dot -->
  <circle cx="200" cy="140" r="10" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="420" cy="452" r="7" fill="#ffffff" fill-opacity="0.6"/>

  <!-- sparkles -->
  <path d="M150 250l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#ffffff" fill-opacity="0.5"/>
  <path d="M452 300l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#ffffff" fill-opacity="0.4"/>
</svg>