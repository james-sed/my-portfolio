<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Event Registration System preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- form card -->
  <g transform="translate(330 120)">
    <rect width="540" height="500" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="600" cy="36" r="8" fill="#ff5f57"/>
    <circle cx="632" cy="36" r="8" fill="#febc2e"/>
    <circle cx="664" cy="36" r="8" fill="#28c840"/>
    <rect x="60" y="84" width="200" height="30" rx="15" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="60" y="150" width="420" height="58" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="60" y="228" width="420" height="58" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="60" y="306" width="420" height="58" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="60" y="406" width="180" height="52" rx="26" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <text x="600" y="720" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.85">registrations.web</text>
</svg>