<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="AWS SBG JRU website preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- browser window -->
  <g transform="translate(280 130)">
    <rect width="640" height="460" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="330" cy="36" r="8" fill="#ff5f57"/>
    <circle cx="362" cy="36" r="8" fill="#febc2e"/>
    <circle cx="394" cy="36" r="8" fill="#28c840"/>
    <rect x="420" y="22" width="150" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="70" y="100" width="360" height="36" rx="18" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="70" y="170" width="280" height="20" rx="10" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="70" y="205" width="320" height="20" rx="10" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="70" y="240" width="250" height="20" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="70" y="320" width="160" height="64" rx="14" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="250" y="320" width="160" height="64" rx="14" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <text x="600" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.85">aws-sbg-jru.web</text>
</svg>