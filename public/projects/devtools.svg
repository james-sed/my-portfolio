<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="DevTools Showcase preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.55" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- component buttons / toggles card -->
  <g transform="translate(300 150)">
    <rect width="600" height="430" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="660" cy="42" r="8" fill="#ff5f57"/>
    <circle cx="692" cy="42" r="8" fill="#febc2e"/>
    <circle cx="724" cy="42" r="8" fill="#28c840"/>

    <rect x="70" y="110" width="200" height="60" rx="30" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="70" y="210" width="200" height="60" rx="30" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="70" y="310" width="200" height="60" rx="14" fill="#ffffff" fill-opacity="0.12"/>

    <g transform="translate(340 128)">
      <rect width="120" height="46" rx="23" fill="#ffffff" fill-opacity="0.9"/>
      <circle cx="150" cy="23" r="19" fill="#03312e"/>
    </g>
    <rect x="340" y="220" width="160" height="46" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="340" y="300" width="180" height="60" rx="18" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <text x="600" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.85">ui-kit.web</text>
</svg>